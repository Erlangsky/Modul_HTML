<!DOCTYPE html>
<html lang="en-US">
<body style="background-color:ghostwhite">
    <!-- warna latar belakang -->
    <h1 style="background-color: dodgerblue;">Hello world</h1>
    <p style="background-color: tomato;">Halo dunia</p>

    <!-- warna font -->
    <h1 style="color: tomato;">Hello world</h1>
    <p style="color: dodgerblue;">halo dunia</p>
    <p style="color: mediumseagreen;">hi dunia</p>

    <!-- warna border / outline -->
    <h1 style="border: 2px solid tomato;">Hello world</h1>
    <h1 style="border: 2px solid dodgerblue;">Halo dunia</h1>
    <h1 style="border: 2px solid violet;">hi dunia</h1>

    <!-- warna color bg sesuai rgb,hex,hsl -->
    <h1 style="background-color: rgb(245, 74, 44);">Hello World</h1>
    <h1 style="background-color: #4dff47;">Halo dunia</h1>
    <h1 style="background-color: hsl(9, 100%, 64%);">hi dunia</h1>

    <h1 style="background-color: rgba(245, 74, 44, 0.5);">Hello World</h1>
    <h1 style="background-color: hsla(9, 100%, 64%, 0.5);">hi dunia</h1>

</body>
</html>
