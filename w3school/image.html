<!DOCTYPE html>
<html lang="en-US">
<head>
    <style>
    body {
        background-image: url('Img/cat.jpg');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: 100% 100%;
    }

    img {
        width: 100px;
        height: 100px;
    }
    
    </style>
</head>
<body>
    <img src="Img/ABCD.webp" alt="AOKAOKAWKAOAWKK">
    <img src="Img/EFGH.webp" alt="SUMPAH GABUT BET">
    <img src="Img/IJKL.webp" alt="AOWOKAWOA" >
    <img src="Img/MNOP.webp" alt="AOWOKAWOA" width="500" height="600">
    <img src="Img/Ryo Yamada.gif" alt="My bini">

    <!-- gambar secara otomatis ke arah kiri dari deretan teks atau gambar -->
    <img src="Img/ABCD.webp" alt="ABCD" style="float: left;">

    <br>
    <!-- masuk ke source sesuai arah kursor -->
    <img src="Img/cat.jpg" alt="car" usemap="#workmap" style="width: 250px;height: 250px;">

    <map name="workmap">
        <area shape="rect" coords="50,50,100,100" href="Img/ABCD.webp" alt="ABCD">
        <area shape="rect" coords="50,50,200,100" href="Img/EFGH.webp" alt="EFGH">
        <area shape="rect" coords="50,50,200,300" href="Img/IJKL.webp" alt="IJKL">
    </map>

    <!-- masukin gambar di elemen -->
    <p style="background-image: url('Img/cat.jpg');">Avv</p>

    <!-- alternatif dari elemtent imager -->
    <!-- *jika tidak ada elemen image -->
    <picture>
        <!-- sayangnya my laptop broswer gw ga suppor 
        element picture  -->
        <source media="(min-width: 650px)" srcset="Img/ABCD.webp">
    </picture>
</body>
</html>
